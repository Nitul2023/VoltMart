spring:
  datasource:
    url: jdbc:h2:mem:voltmart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: TestSecretKeyThatIsAtLeastSixtyFourCharactersLongForHS512Algorithm!!
    expiration-ms: 3600000
