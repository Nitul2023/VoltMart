services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: electroshop
      POSTGRES_USER: electroshop
      POSTGRES_PASSWORD: electroshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electroshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/electroshop
      DB_USER: electroshop
      DB_PASSWORD: electroshop
      JWT_SECRET: VoltMartDevSecretKeyThatIsAtLeastSixtyFourCharactersLongForHS512!!
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
